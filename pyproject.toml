[project]
name = "maniac-media"
version = "2.1.0"
description = "Unified movie & TV automation platform (Sonarr + Radarr, redesigned)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not e2e'"
markers = ["e2e: browser end-to-end tests (need Playwright + built frontend)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/db/migrations/*", "backend/plugins/download_clients/deluge.py", "backend/plugins/download_clients/nzbget.py"]

[tool.coverage.report]
skip_covered = true
show_missing = false

[tool.ruff]
line-length = 140
target-version = "py312"
