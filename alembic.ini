# Migrations normally run automatically at startup (with a backup first).
# Manual use:  alembic upgrade head   /   alembic revision -m "describe change"
[alembic]
script_location = backend/db/migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
